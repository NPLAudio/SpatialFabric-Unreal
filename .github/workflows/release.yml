name: Unreal Release Artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching SpatialFabric.uplugin'
        required: true
        default: '2.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and query examples
        run: |
          python -m unittest discover -s Tools -p 'test_*.py'
          node --test Examples/OSCSceneQuery/test_scene_query.js
      - name: Validate version
        env:
          REQUEST_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          version=json.loads(Path('SpatialFabric.uplugin').read_text())['VersionName']
          requested=os.environ.get('REQUEST_VERSION') if os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' else os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert re.fullmatch(r'\d+\.\d+\.\d+',version) and requested==version, 'Tag/input must match descriptor'
          PY
      - name: Package Unreal source distributions
        run: python Tools/package_release.py --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: unreal-release
          path: dist/release/*
          if-no-files-found: error
      - name: Publish without overwriting existing validated assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(python -c "import json; print(json.load(open('SpatialFabric.uplugin'))['VersionName'])")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; not overwriting artifacts or checksums.'
          else
            gh release create "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "SpatialFabric Unreal ${TAG#v}" --notes-file dist/release/RELEASE_NOTES.md
          fi
