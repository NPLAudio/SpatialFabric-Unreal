# Create a release zip of the SpatialFabric plugin for NPLAudio/SpatialFabric
# Trigger: push a version tag (v*) or run manually from Actions tab
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Or: Actions -> Release Plugin -> Run workflow

name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '2.0.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate combined plugin layout
        run: python3 -m unittest discover -s Tools -p 'test_*.py'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_REF: ${{ github.ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${TAG_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          fi
          # Sanitize: allow only semver chars (digits and dots)
          SAFE_VERSION=$(echo "$VERSION" | tr -cd '0-9.')
          [ -z "$SAFE_VERSION" ] && SAFE_VERSION="0.0.0"
          echo "tag=v${SAFE_VERSION}" >> $GITHUB_OUTPUT
          echo "name=${SAFE_VERSION}" >> $GITHUB_OUTPUT

      - name: Create plugin zip
        env:
          RELEASE_NAME: ${{ steps.version.outputs.name }}
        run: |
          PLUGIN_DIR=SpatialFabric
          mkdir -p dist/${PLUGIN_DIR}
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.gitignore' \
            --exclude='.claude' \
            --exclude='docs' \
            --exclude='Binaries' \
            --exclude='Intermediate' \
            --exclude='Saved' \
            --exclude='DerivedDataCache' \
            --exclude='Examples' \
            --exclude='Presentations' \
            --exclude='Apps' \
            --exclude='.pi' \
            --exclude='*.pdb' \
            --exclude='.DS_Store' \
            . dist/${PLUGIN_DIR}/
          cd dist
          zip -r "SpatialFabric-${RELEASE_NAME}.zip" ${PLUGIN_DIR}
          cd ..
          echo "ZIP_PATH=dist/SpatialFabric-${RELEASE_NAME}.zip" >> $GITHUB_ENV
          echo "ZIP_NAME=SpatialFabric-${RELEASE_NAME}.zip" >> $GITHUB_ENV

      - name: Create standalone source example zip
        env:
          RELEASE_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 Tools/prepare_example.py --destination "$RUNNER_TEMP/SpatialFabricShowcase"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/dist/SpatialFabric-Example-${RELEASE_NAME}.zip" SpatialFabricShowcase

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            dist/SpatialFabric-Example-${{ steps.version.outputs.name }}.zip
            Presentations/SpatialFabric_From_Cue_to_Space.pptx
            Presentations/SpatialFabric_From_Cue_to_Space.pdf
          name: Release ${{ steps.version.outputs.name }}
          body: |
            ## SpatialFabric ${{ steps.version.outputs.name }}

            Source-only release: compile against your Unreal Engine installation.
            Run Native Unreal validation on a provisioned host before production deployment.
            Spatial audio control and direct device/channel playback for Unreal Engine.
            Includes AudioLoom playback and CSV routing in the SpatialFabric Playback tab.

            ### Installation

            1. Download the zip file
            2. Extract and copy the `SpatialFabric` folder into your project's `Plugins` directory
            3. When upgrading AudioLoom, remove the standalone AudioLoom plugin and its .uproject entry first
            4. Regenerate project files/rebuild as needed, then restart Unreal Editor

            ### Requirements

            - UE 5.8 Win64 is the validated native combination; other combinations need their own validation
            - OSC plugin (bundled with UE)
            - Matching C++ toolchain; both ZIPs are source distributions

            ### Example and presentation

            The Example ZIP contains the playable showcase source project and its project-local plugin.
            Build/open its SpatialFabricShowcase.uproject; audio is manual-start and quiet.
            The editable PowerPoint and PDF cover a 15-minute sound-designer talk, a separate
            10-minute demo and Q&A. The full repository includes speaker notes and a demo run sheet.
            Physical audio/latency and actual cooked-codec certification remain separate release gates.
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
